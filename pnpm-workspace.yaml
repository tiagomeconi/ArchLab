packages:
  - "apps/*"
  - "packages/*"

# Scripts de instalação de dependências precisam de aprovação. O esbuild (usado pelo Vite) precisa do dele.
# Duas chaves, uma por geração do pnpm: a hospedagem pode usar uma versão diferente da do packageManager.
allowBuilds:            # pnpm 11+
  esbuild: true
onlyBuiltDependencies:  # pnpm 9 e 10
  - esbuild
strictDepBuilds: false
