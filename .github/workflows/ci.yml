name: CI

on:
  push:
    branches: [main, roadmap]
  pull_request:

jobs:
  unit:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: npm --prefix supabase/tests ci --ignore-scripts
      - run: npm --prefix supabase/tests test
      - run: pnpm --filter @archlab/web gen:assessments
      - run: pnpm --filter @archlab/web build

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      # sem as chaves do Supabase o app roda em modo local (sem login), que é o que os testes esperam
      - run: python -m pytest e2e -q
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
